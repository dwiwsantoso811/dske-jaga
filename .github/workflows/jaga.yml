name: jaga-supabase

# Supabase free mem-pause project setelah 7 hari tanpa aktivitas.
# Workflow ini menyentuh database tiap hari supaya timer ter-reset,
# tanpa bergantung pada PC menyala.
#
# URL dan key ditulis langsung, bukan lewat Secrets, karena:
#   - publishable/anon key memang dirancang publik (ada juga di HTML website)
#   - tabel mentah dilindungi RLS, hanya RPC security definer yang bisa dipanggil
# Tidak ada secret key di sini.

on:
  schedule:
    - cron: '0 1 * * *'      # 08:00 WIB
  workflow_dispatch:

jobs:
  sentuh:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil RPC publik dske_tema
        env:
          URL: https://sjjhmtcnrniyrpldcgdf.supabase.co
          KEY: sb_publishable_SzSKMC_TzFMKoWKLGPKwdg_6ZZIsnZL
        run: |
          set -euo pipefail
          kode=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "$URL/rest/v1/rpc/dske_tema" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $kode"
          head -c 300 /tmp/out.json; echo
          [ "$kode" = "200" ] || exit 1
